server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # React frontend
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Backend API
    location /api/ {
        proxy_pass https://disaster-relief-server.onrender.com;

        # Required for HTTPS/SNI with Render
        proxy_ssl_server_name on;
        proxy_ssl_name disaster-relief-server.onrender.com;

        proxy_http_version 1.1;

        proxy_set_header Host disaster-relief-server.onrender.com;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Socket.IO
    location /socket.io/ {
        proxy_pass https://disaster-relief-server.onrender.com;

        # Required for HTTPS/SNI with Render
        proxy_ssl_server_name on;
        proxy_ssl_name disaster-relief-server.onrender.com;

        proxy_http_version 1.1;

        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host disaster-relief-server.onrender.com;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}